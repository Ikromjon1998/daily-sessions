name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Pin the interpreter to match the local venv (Python 3.14). Taking the
      # runner's default would produce failures that do not reproduce locally.
      # Putting .venv/bin on PATH makes later steps use it without activating.
      - name: Create venv
        run: |
          uv venv --python 3.14
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install tooling
        run: uv pip install -r requirements-dev.txt

      # Exactly what runs locally: ruff format, ruff check, mypy strict, pytest.
      - name: Check
        run: make check
